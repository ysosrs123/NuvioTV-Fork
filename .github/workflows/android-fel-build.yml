name: Build Cube 3 FEL APK

# Manually triggered. Builds the separate Fire TV Cube 3 (Gazelle) FEL APK: fullDebug with
# -PDVFEL_GAZELLE_ENABLED=true, armeabi-v7a only, with libdvfelplay.so and libnuvio_dvfel.so. The normal
# APK built by the other workflows never contains them. Release FEL APKs come from "Build Android TV
# Release", which attaches app-full-fel-armeabi-v7a-release.apk next to the normal APKs.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fel-debug-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fel-debug-build:
    name: Build FEL fullDebug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare local properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
          LOCAL_DEV_PROPERTIES_BASE64: ${{ secrets.LOCAL_DEV_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          else
            touch local.properties
          fi

          if [ -n "$LOCAL_DEV_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_DEV_PROPERTIES_BASE64" | base64 --decode > local.dev.properties
          else
            touch local.dev.properties
          fi

      - name: Prepare CI signing config
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/ci-debug.jks" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/ci-debug.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=androiddebugkey"
            echo "NUVIO_RELEASE_KEY_PASSWORD=android"
            echo "NUVIO_RELEASE_STORE_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Build FEL fullDebug APK
        run: ./gradlew :app:assembleFullDebug -PDVFEL_GAZELLE_ENABLED=true --stacktrace

      - name: Check the FEL libraries are packaged
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/full/debug/*.apk)
          (( ${#apks[@]} > 0 )) || { echo "No APK was produced." >&2; exit 1; }
          for apk in "${apks[@]}"; do
            for lib in libdvfelplay.so libnuvio_dvfel.so; do
              unzip -l "$apk" | grep -q "lib/armeabi-v7a/$lib" || { echo "$apk lacks $lib" >&2; exit 1; }
            done
          done

      - name: Upload FEL fullDebug APK
        uses: actions/upload-artifact@v7
        with:
          name: nuviotv-fel-full-debug
          path: app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 14
