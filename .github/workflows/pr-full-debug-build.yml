name: PR Full Debug Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev]
  workflow_dispatch:
    inputs:
      variant:
        description: App variant to build
        type: choice
        options: [full, iptvPrototype]
        default: full
      build_type:
        description: Build type (release is minified with R8)
        type: choice
        options: [debug, release]
        default: debug

permissions:
  contents: read

concurrency:
  group: pr-full-debug-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-debug-build:
    name: Build fullDebug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare local properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
          LOCAL_DEV_PROPERTIES_BASE64: ${{ secrets.LOCAL_DEV_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          else
            touch local.properties
          fi

          if [ -n "$LOCAL_DEV_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_DEV_PROPERTIES_BASE64" | base64 --decode > local.dev.properties
          else
            touch local.dev.properties
          fi

      - name: Prepare CI signing config
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/ci-debug.jks" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/ci-debug.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=androiddebugkey"
            echo "NUVIO_RELEASE_KEY_PASSWORD=android"
            echo "NUVIO_RELEASE_STORE_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Test and build debug APK
        env:
          VARIANT: ${{ inputs.variant || 'full' }}
          BUILD_TYPE: ${{ inputs.build_type || 'debug' }}
        run: |
          set -o pipefail
          if [ "$BUILD_TYPE" = "release" ]; then
            flavour="$(printf '%s' "${VARIANT:0:1}" | tr '[:lower:]' '[:upper:]')${VARIANT:1}"
            tasks=":app:assemble${flavour}Release"
          elif [ "$VARIANT" = "iptvPrototype" ]; then
            tasks=":app:testIptvPrototypeDebugUnitTest --tests com.nuvio.tv.core.iptv.* --tests com.nuvio.tv.data.iptv.* :app:assembleIptvPrototypeDebug"
          else
            tasks=":app:testFullDebugUnitTest --tests com.nuvio.tv.updater.* :app:assembleFullDebug"
          fi
          if ! ./gradlew $tasks --continue 2>&1 | tee build.log; then
            echo "---- build errors ----"
            grep -E "^e: |^w: .*error|What went wrong|FAILED|Execution failed|> .*Exception|expected:<" build.log | grep -v "^\s*at " | tail -80
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/${{ inputs.variant || 'full' }}/${{ inputs.build_type || 'debug' }}/app-${{ inputs.variant || 'full' }}-arm64-v8a-${{ inputs.build_type || 'debug' }}.apk
          archive: false
          if-no-files-found: error
          retention-days: 7
